---
# Greenwood Gateway Network Inspection
#
# The inventory defines the gateway's interfaces and addresses.
# The gateway carries no Greenwood protocol role.
# Normal convergence never deletes identities or stops protocol services.
# Destructive removal is isolated in gateway_teardown.yml.
#
# Usage:
#   ansible-playbook gateway.yml -i inventory/generated.ini

- name: Verify inventory-supplied gateway network identities
  hosts: gateway
  become: true
  gather_facts: false
  vars:
    ansible_python_interpreter: /usr/bin/python3
    # node-4 is the gateway/router; source retrieval does not require an SSH agent.
    ansible_ssh_common_args: "-o ControlMaster=auto -o ControlPersist=60s -o ForwardAgent=no"
  roles:
    - role: gateway
      tags: [gateway]
