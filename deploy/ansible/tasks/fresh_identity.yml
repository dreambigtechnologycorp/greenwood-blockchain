---
- name: Require human-operated access before inspecting or provisioning identities
  ansible.builtin.assert:
    that:
      - greenwood_operator_secret_access_authorized | default(false) | bool
    fail_msg: >-
      This workflow can read private identity files, including through stat
      checksums and validation scripts. The human operator must run it outside
      the AI session. See deploy/production/OPERATOR_KEY_CUSTODY.md.

- name: Create protected identity directory
  ansible.builtin.file:
    path: /etc/greenwood
    state: directory
    owner: root
    group: root
    mode: '0700'

- name: Copy approved genesis and chain configuration without replacing existing files
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "/etc/greenwood/{{ item.name }}"
    owner: root
    group: root
    mode: '0600'
    force: false
  loop:
    - {src: "{{ greenwood_genesis_src }}", name: genesis.json}
    - {src: "{{ greenwood_chain_config_src }}", name: chain.json}
  no_log: true
  diff: false

- ansible.builtin.import_tasks: validate_installed_public_config.yml

- name: Copy approved per-node identities without replacing existing files
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "/etc/greenwood/{{ item.name }}"
    owner: root
    group: root
    mode: '0600'
    force: false
  loop:
    - {src: "{{ greenwood_provider_key_src }}", name: provider.key}
    - {src: "{{ greenwood_operator_token_src }}", name: operator.token}
  no_log: true
  diff: false

- name: Copy validator key only onto validators
  ansible.builtin.copy:
    src: "{{ greenwood_validator_key_src }}"
    dest: /etc/greenwood/validator.key
    owner: root
    group: root
    mode: '0600'
    force: false
  when: inventory_hostname in groups['validators']
  no_log: true
  diff: false

- ansible.builtin.import_tasks: validate_installed_identity.yml
