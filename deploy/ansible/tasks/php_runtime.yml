---
# PHP package names use the ABI series; package versions include vendor revisions.
# Fail if the configured repository cannot supply the approved security release.
- name: Provision approved PHP package repository before package installation
  ansible.builtin.import_tasks: php_repository.yml

- name: Install PHP 8.5.12 runtime and bundled extensions
  ansible.builtin.apt:
    name:
      - "php8.5-cli=8.5.12*"
      - "php8.5-common=8.5.12*"
      - "php8.5-curl=8.5.12*"
      - "php8.5-xml=8.5.12*"
      - "php8.5-mbstring=8.5.12*"
      - "php8.5-sqlite3=8.5.12*"
    state: present
    update_cache: true
    policy_rc_d: 101

- name: Require the approved PHP security runtime on the executable path
  ansible.builtin.command:
    argv:
      - /usr/bin/php
      - -r
      - 'if (PHP_VERSION_ID !== 80512) { fwrite(STDERR, "PHP 8.5.12 required; found ".PHP_VERSION."\n"); exit(1); } echo PHP_VERSION;'
  changed_when: false
  when: not ansible_check_mode
