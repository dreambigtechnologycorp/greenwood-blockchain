---
- name: Require unique HTTPS service names
  ansible.builtin.assert:
    that:
      - greenwood_https_frontends | map(attribute='name') | unique | length == greenwood_https_frontends | length

- name: Validate explicit HTTPS frontend inputs
  ansible.builtin.assert:
    that:
      - item.name in ['controller', 'registry', 'registry-auth', 'rpc']
      - item.address is match('^[0-9.]+$')
      - item.port | int >= 1024
      - item.port | int <= 65535
      - item.tls_name is match('^[A-Za-z0-9.-]+$')
      - item.backend is match('^http://127\.0\.0\.1:[0-9]+$')
      - item.request_limit | int >= 0
      - item.certificate is match('^/etc/greenwood/[A-Za-z0-9_./-]+$')
      - item.private_key is match('^/etc/greenwood/[A-Za-z0-9_./-]+$')
      - item.ca is match('^/etc/greenwood/[A-Za-z0-9_./-]+$')
      - item.ca_sha256 is match('^[a-f0-9]{64}$')
      - "'..' not in item.certificate and '..' not in item.private_key and '..' not in item.ca"
  loop: "{{ greenwood_https_frontends }}"

- name: Install standalone Apache HTTPS prerequisite
  ansible.builtin.apt:
    name: apache2
    state: present
    policy_rc_d: 101

- name: Verify provisioned private TLS key and certificate pair
  ansible.builtin.command:
    argv:
      - /usr/bin/php
      - -r
      - >-
        foreach(array_slice($argv,1,3) as $f){for($p=$f;;$p=dirname($p)){
        if(is_link($p)||!file_exists($p)||fileowner($p)!==0||(fileperms($p)&0022)!==0)exit(1);
        if($p==='/')break;}}
        if((fileperms($argv[2])&0077)!==0)exit(2);
        if(!openssl_x509_check_private_key(file_get_contents($argv[1]),file_get_contents($argv[2])))exit(3);
        if(openssl_x509_fingerprint(file_get_contents($argv[3]),'sha256')!==$argv[4])exit(4);
      - "{{ item.certificate }}"
      - "{{ item.private_key }}"
      - "{{ item.ca }}"
      - "{{ item.ca_sha256 }}"
  loop: "{{ greenwood_https_frontends }}"
  changed_when: false
  check_mode: false
  no_log: true

- name: Verify TLS chain expiry and intended identity
  ansible.builtin.command:
    argv:
      - /usr/bin/openssl
      - verify
      - -CAfile
      - "{{ item.ca }}"
      - "{{ '-verify_ip' if item.tls_name is match('^[0-9.]+$') else '-verify_hostname' }}"
      - "{{ item.tls_name }}"
      - "{{ item.certificate }}"
  loop: "{{ greenwood_https_frontends }}"
  changed_when: false
  check_mode: false

- name: Stage HTTPS configuration without changing existing Apache sites
  ansible.builtin.template:
    src: https.conf.j2
    dest: "/etc/greenwood/control-plane/{{ item.name }}-https.conf"
    owner: root
    group: root
    mode: '0600'
  loop: "{{ greenwood_https_frontends }}"

- name: Stage HTTPS units without activation
  ansible.builtin.template:
    src: https.service.j2
    dest: "/etc/systemd/system/greenwood-{{ item.name }}-https.service"
    owner: root
    group: root
    mode: '0644'
  loop: "{{ greenwood_https_frontends }}"
  notify: Reload control-plane units
