---
- name: Require explicit reviewed storage scope and safe invocation
  ansible.builtin.assert:
    that:
      - greenwood_storage_operation in ['check', 'apply']
      - greenwood_storage_resume_prepared_target is boolean
      - greenwood_storage_resume_mounted_client == ''
      - greenwood_storage_preparation_approved | bool
      - greenwood_recovery_access_confirmed | default(false) | bool
      - greenwood_topology_profile == 'seven'
      - ansible_play_hosts_all | sort == groups['all'] | sort
      - greenwood_storage_operation != 'apply' or greenwood_operator_secret_access_authorized | bool
      - greenwood_storage_operation != 'apply' or not ansible_check_mode
    fail_msg: Review and approve the exact public storage plan; apply is operator-only and never starts Greenwood

- name: Validate exact public plan and reviewed hash before inspecting hosts
  ansible.builtin.set_fact:
    greenwood_checked_storage_plan: "{{ greenwood_storage_plan | greenwood_state_plan(greenwood_storage_plan_sha256) }}"

- name: Require separate existing-media content approval before any apply phase
  ansible.builtin.assert:
    that:
      - greenwood_storage_operation != 'apply' or greenwood_checked_storage_plan.clients[item].empty_media_approved | bool
  loop: [node-5, node-6, node-7]

- ansible.builtin.import_tasks: "{{ playbook_dir }}/../tasks/topology_preflight.yml"

- name: Bind the storage plan to the approved physical machine inventory
  ansible.builtin.assert:
    that:
      - (greenwood_checked_storage_plan.target.machine_id if inventory_hostname == 'node-4' else greenwood_checked_storage_plan.clients[inventory_hostname].machine_id) == greenwood_expected_machine_id

- ansible.builtin.import_tasks: copy_metadata_preflight.yml

- name: Check shared SSD exports or client media and inactivity without changes
  ansible.builtin.command:
    argv:
      - /usr/bin/python3
      - -c
      - >-
        import sys,types;
        m=types.ModuleType('storage_plan');
        exec({{ lookup('file', role_path ~ '/../../files/storage_plan.py') | to_json }},m.__dict__);
        sys.modules['storage_plan']=m;
        s=types.ModuleType('prepare_state_storage');
        sys.modules['prepare_state_storage']=s;
        exec({{ lookup('file', role_path ~ '/../../files/prepare_state_storage.py') | to_json }},s.__dict__);
        r=types.ModuleType('validate_prepared_storage_target');
        exec({{ lookup('file', role_path ~ '/../../files/validate_prepared_storage_target.py') | to_json }},r.__dict__);
        {{ 'r' if greenwood_storage_resume_prepared_target and inventory_hostname == 'node-4' else 's' }}.main()
      - --plan-json
      - "{{ greenwood_checked_storage_plan | to_json }}"
      - --approved-sha256
      - "{{ greenwood_storage_plan_sha256 }}"
      - --node
      - "{{ inventory_hostname }}"
      - --action
      - check
  changed_when: false
  check_mode: false
  register: greenwood_storage_probe
  failed_when: false
  no_log: true

- name: Require a successful storage probe with a bounded diagnostic
  ansible.builtin.assert:
    that: greenwood_storage_probe.rc == 0
    fail_msg: >-
      {{ (greenwood_storage_probe.stderr if greenwood_storage_probe.stderr is match('^STORAGE STOP: ')
          else 'Storage probe failed before a bounded result; review target prerequisites')[:1024] }}

- name: Record the all-node storage preparation check
  ansible.builtin.set_fact:
    greenwood_storage_checked_sha256: "{{ greenwood_storage_plan_sha256 }}"
