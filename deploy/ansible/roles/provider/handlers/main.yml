---

- name: Cleanup containerd archive
  ansible.builtin.file:
    path: "/tmp/containerd-{{ containerd_version }}-linux-arm64.tar.gz"
    state: absent

- name: Cleanup containerd extraction
  ansible.builtin.file:
    path: "/tmp/containerd-extract"
    state: absent

- name: Cleanup runc archive
  ansible.builtin.file:
    path: "/tmp/runc.arm64"
    state: absent

# Provider release-staging artifact cleanup is owned by
# common/tasks/converge_release_tree.yml (staged artifact + staging directory
# are removed in the same pass).

- name: Reload systemd daemon
  ansible.builtin.systemd:
    daemon_reload: true

- name: Restart containerd
  ansible.builtin.systemd:
    name: containerd
    state: restarted
    daemon_reload: true
