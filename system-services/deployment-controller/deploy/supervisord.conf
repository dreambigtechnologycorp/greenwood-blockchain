; Local staging only. No configured physical admission endpoints; writes disabled.
[program:deployment-controller]
command=/usr/bin/php -d display_errors=0 -S 127.0.0.1:8000 public/index.php
directory=/opt/greenwood/system-services/deployment-controller
numprocs=1
autostart=false
autorestart=true
user=greenwood-controller
umask=0077
redirect_stderr=true
stdout_logfile=/dev/null
stdout_logfile_maxbytes=0
