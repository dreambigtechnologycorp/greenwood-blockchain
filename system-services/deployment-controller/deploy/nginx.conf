# Include inside http {}. Staging only: H8/external enablement remains blocked.
limit_req_zone $binary_remote_addr zone=deployment_controller:10m rate=100r/m;
log_format deployment_controller escape=json '{"request_id":"$request_id","status":$status,"latency":$request_time}';
server {
    listen 127.0.0.1:8443 ssl;
    server_name controller.greenwoodblockchain.com;
    ssl_certificate /etc/ssl/certs/controller.greenwoodblockchain.com.crt;
    ssl_certificate_key /etc/ssl/private/controller.greenwoodblockchain.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log /var/log/nginx/deployment-controller-access.log deployment_controller;
    # Nginx error logs can include request URIs and query credentials; suppress here.
    error_log /dev/null crit;
    limit_req zone=deployment_controller burst=20 nodelay;
    limit_req_status 429;
    client_max_body_size 64k;
    root /var/www/deployment-controller/public;
    location = /metrics { return 404; }
    location / {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param HTTP_X_REQUEST_ID $request_id;
        fastcgi_param PHP_ADMIN_VALUE "display_errors=off";
        fastcgi_pass unix:/var/run/php/php8.5-fpm.sock;
    }
}
